<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Invoice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap" id="app">
    <section class="card"><p class="muted">Loading invoice…</p></section>
  </main>

  <script src="config.js"></script>
  <script src="invoice.js"></script>
  <script>
    const app = document.getElementById("app");
    // Links look like index.html#<id>; ?id=<id> also works.
    const id = location.hash.slice(1) || new URLSearchParams(location.search).get("id");

    function message(title, text) {
      app.replaceChildren(el("section", { class: "card center" },
        el("h1", {}, title),
        el("p", { class: "muted" }, text),
      ));
    }

    async function load() {
      if (!id) return message("Invoice not found", "This link is missing an invoice ID.");
      let data;
      try {
        data = await api("get", { id });
      } catch (err) {
        if (err.message === "not_found") return message("Invoice not found", "This link is invalid or the invoice was removed.");
        return message("Couldn't load invoice", err.message);
      }
      if (data.status === "disabled") {
        return message("Link no longer active", "This invoice link has been deactivated. Please contact the sender for an updated link.");
      }
      render(data);
    }

    function render(data) {
      const inv = data.invoice;
      const cur = inv.cur || "USD";
      const payments = data.payments || [];
      const reference = inv.inv ? `Invoice ${inv.inv}` : "";

      // Browsers use the title as the default PDF file name.
      document.title = [inv.inv ? `Invoice ${inv.inv}` : "Invoice", inv.client].filter(Boolean).join(" - ");

      const toolbar = el("div", { class: "toolbar no-print" },
        el("button", { class: "btn secondary small-btn", type: "button", onclick: () => window.print() }, "Download PDF"),
      );

      app.replaceChildren(
        toolbar,
        invoiceCard(data, { cur, payments, reference }),
        ...(data.status === "paid" ? [] : [paymentSection(payments, { cur, reference })]),
      );
    }

    // ---------- The invoice document (also exactly what the PDF contains) ----------
    function invoiceCard(data, { cur, payments, reference }) {
      const inv = data.invoice;
      const biz = data.business || {};
      const card = el("section", { class: "card doc" });

      if (data.status === "paid") {
        card.append(el("div", { class: "banner paid" },
          el("strong", {}, "Paid"),
          data.paidAt ? ` – payment reported on ${formatDate(data.paidAt.slice(0, 10))}` : "",
        ));
      }

      const metaRows = [
        ...[
          ["Invoice #", inv.inv],
          ["Date", formatDate(inv.date)],
          ["Due", formatDate(inv.due)],
        ].filter(([, v]) => v),
        ...(inv.custom || []),
      ];

      card.append(el("div", { class: "header" },
        el("div", {},
          el("h1", {}, "Invoice"),
          biz.name && el("div", {}, el("strong", {}, biz.name)),
          biz.email && el("div", { class: "muted small" }, biz.email),
          biz.address && el("div", { class: "muted small pre" }, biz.address),
        ),
        el("div", { class: "meta" },
          ...metaRows.map(([k, v]) => el("div", { class: "meta-row" }, el("span", {}, k), el("span", {}, v))),
        ),
      ));

      const week = [formatDate(inv.weekStart), formatDate(inv.weekEnd)].filter(Boolean).join(" – ");
      if (inv.client || week) {
        card.append(el("div", { class: "billto two-col" },
          inv.client && el("div", {},
            el("div", { class: "muted small" }, "Bill to"),
            el("div", {}, el("strong", {}, inv.client)),
            inv.client_email && el("div", { class: "muted small" }, inv.client_email),
          ),
          week && el("div", {},
            el("div", { class: "muted small" }, "Work period"),
            el("div", {}, el("strong", {}, week)),
          ),
        ));
      }

      if (inv.work) {
        card.append(el("div", { class: "section" },
          el("h3", {}, "Work completed"),
          el("div", { class: "pre" }, inv.work),
        ));
      }

      const tbody = el("tbody");
      for (const p of payments) {
        tbody.append(el("tr", {},
          el("td", {}, p.name),
          el("td", {}, p.paidAt
            ? el("span", { class: "pill paid" }, `Sent ${formatDate(p.paidAt.slice(0, 10))}`)
            : el("span", { class: "pill open" }, "Due")),
          el("td", { class: "num" }, formatMoney(p.amount, cur)),
        ));
      }
      card.append(el("table", {},
        el("thead", {}, el("tr", {},
          el("th", {}, "Payment"), el("th", {}, "Status"), el("th", { class: "num" }, "Amount"),
        )),
        tbody,
      ));
      card.append(el("div", { class: "total-row" },
        el("span", {}, data.status === "paid" ? "Total" : "Total due"),
        el("span", {}, formatMoney(inv.total, cur)),
      ));
      if (payments.length > 1) {
        card.append(el("p", { class: "muted small right" }, `Paid as ${payments.length} separate transfers, as listed above.`));
      }

      // Payment instructions for the PDF; on screen they're in the cards below with copy buttons.
      const due = payments.filter((p) => !p.paidAt);
      if (due.length) {
        card.append(el("div", { class: "section print-only" },
          el("h3", {}, "Payment details"),
          ...due.map((p) => el("div", { class: "print-method" },
            el("strong", {}, `${p.name} – ${formatMoney(p.amount, cur)}`),
            ...p.fields.filter(([, v]) => v).map(([k, v]) => el("div", { class: "small" }, el("span", { class: "muted" }, `${k}: `), v)),
          )),
          reference && el("div", { class: "small" }, el("span", { class: "muted" }, "Payment reference: "), reference),
        ));
      }

      if (inv.notes) card.append(el("p", { class: "notes" }, inv.notes));
      return card;
    }

    // ---------- How to pay (screen only) ----------
    function copyField(label, value) {
      if (!value) return null;
      const btn = el("button", { class: "copy-btn", type: "button" }, "Copy");
      btn.addEventListener("click", async () => {
        try { await copyText(String(value)); flashCopied(btn); }
        catch { btn.textContent = "Copy failed"; }
      });
      return el("div", { class: "field" },
        el("div", {}, el("div", { class: "label" }, label), el("div", { class: "value" }, value)),
        btn,
      );
    }

    function paymentSection(payments, { cur, reference }) {
      const wrap = el("div", { class: "no-print" });
      if (payments.length > 1) {
        wrap.append(el("div", { class: "banner split" },
          el("strong", {}, `This invoice is paid in ${payments.length} parts. `),
          "Please send each payment below separately, then confirm each one."));
      }
      payments.forEach((p, i) => wrap.append(paymentCard(p, { cur, reference, step: payments.length > 1 ? i + 1 : 0 })));
      return wrap;
    }

    function paymentCard(p, { cur, reference, step }) {
      const amount = Number(p.amount).toFixed(2);
      const title = `${step ? `${step}. ` : ""}Pay ${formatMoney(p.amount, cur)} via ${p.name}`;
      const card = el("section", { class: "card" }, el("h2", {}, title));

      if (p.paidAt) {
        card.append(el("p", { class: "success" }, `✓ Marked as sent on ${new Date(p.paidAt).toLocaleString()}. Thank you!`));
        return card;
      }

      // copyField returns null for empty values; DOM append would print those as "null".
      card.append(...[
        ...p.fields.map(([label, value]) => copyField(label, value)),
        copyField(`Amount (${cur})`, amount),
        copyField("Payment reference", reference),
      ].filter(Boolean));

      const open = el("button", { class: "btn blue", type: "button" }, `I've sent this ${p.name} payment`);
      const ref = el("input", { placeholder: p.method === "paypal" ? "PayPal transaction ID" : "Bank confirmation number" });
      const status = el("p", { class: "small" });
      const confirm = el("button", { class: "btn ok", type: "submit" }, "Confirm payment sent");
      const form = el("form", { hidden: "", class: "confirm-form" },
        el("label", {}, "Transaction reference", el("span", { class: "opt" }, "optional")), ref,
        el("div", { class: "btn-row" }, confirm),
        status,
      );
      open.addEventListener("click", () => { open.hidden = true; form.hidden = false; ref.focus(); });
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        confirm.disabled = true;
        status.textContent = "Sending…";
        status.className = "small muted";
        try {
          await api("paid", { id, method: p.method, reference: ref.value.trim() });
          await load();
        } catch (err) {
          confirm.disabled = false;
          status.textContent = `Couldn't send: ${err.message} Please try again.`;
          status.className = "small error";
        }
      });
      card.append(el("div", { class: "btn-row" }, open), form);
      return card;
    }

    window.addEventListener("hashchange", () => location.reload());
    load();
  </script>
</body>
</html>
